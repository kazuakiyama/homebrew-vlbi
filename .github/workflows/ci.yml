name: Build VLBI packages and test DIFMAP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up tap
        run: |
          brew update
          # Clone the checked-out commit so pull requests test their own formula.
          brew tap --custom-remote kazuakiyama/vlbi "$GITHUB_WORKSPACE"
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula kazuakiyama/vlbi/pgplot
            brew trust --formula kazuakiyama/vlbi/sched
            brew trust --formula kazuakiyama/vlbi/difmap
          fi
          brew config

      - name: Build PGPLOT
        run: |
          brew install --build-from-source kazuakiyama/vlbi/pgplot

      - name: Build SCHED
        run: brew install --build-from-source --verbose kazuakiyama/vlbi/sched

      - name: Build and test DIFMAP
        run: |
          brew install --build-from-source --verbose kazuakiyama/vlbi/difmap
          brew test kazuakiyama/vlbi/difmap

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-logs-${{ matrix.os }}
          path: ~/Library/Logs/Homebrew
          if-no-files-found: ignore
